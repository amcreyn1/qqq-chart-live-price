name: Update QQQ prices

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC on weekdays, after the US market close
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python update_qqq.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add qqq.csv
          git diff --cached --quiet || (git commit -m "Update QQQ closes" && git push)
